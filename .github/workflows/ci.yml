name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "*"
    paths:
      - .github/**
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
  pull_request:
    branches: [main]
    paths:
      - .github/**
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock

permissions:
  contents: write # Required for GitHub Release creation
  id-token: write # Required for PyPI trusted publishing (OIDC)

jobs:
  # Deploy jobs - only run on valid version tags
  check-release-tag:
    name: check-release-tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-release-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Validate PEP-440 tag (extract & check) and set output
        id: check-release-tag
        # The script derives the candidate from GITHUB_REF and writes version=... to GITHUB_OUTPUT
        run: |
          set -euo pipefail
          uv run --no-project .github/scripts/check-release-tag.py

  pre-commit:
    runs-on: ubuntu-latest
    env:
      LUALS_VERSION: 3.19.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Sync project environment (for mypy)
        run: uv sync --all-extras --dev

      - name: Run pre-commit on all files
        run: uvx pre-commit run --all-files

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [pre-commit]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run tests
        run: |
          uv sync --frozen --group test
          uv run pytest --cov=src/u2mcp --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tanbro/uiautomator2-mcp-server

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [check-release-tag, pre-commit, test]
    if: needs.check-release-tag.outputs.version != ''

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build package
        run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.check-release-tag.outputs.version }}

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  build-executable:
    name: Build executable(${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check-release-tag, pre-commit, test]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-20.04, windows-latest, macos-latest]
    if: needs.check-release-tag.outputs.version != ''
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build executable
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.check-release-tag.outputs.version }}
        run: |
          uv sync --frozen --group pyinstaller
          uv run pyinstaller u2mcp.spec
      - name: Package artifacts
        shell: bash
        run: |
            mkdir -p executables
            (cd dist && zip -r ../executables/u2mcp-${{runner.os}}-${needs.check-release-tag.outputs.version}.zip u2mcp)
        if: runner.os != 'Windows'
      - name: Package artifacts (Windows 7z)
        shell: pwsh
        run: |
          mkdir -p executables
          Set-Location dist
          &7z a -r -spf2 "../executables/u2mcp-$($env:RUNNER_OS)-${{needs.check-release-tag.outputs.version}}.zip" u2mcp
        if: runner.os == 'Windows'
      - name: Store the executable
        uses: actions/upload-artifact@v7
        with:
          name: pyinstaller-executables-${{ matrix.os }}
          path: executables/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [check-release-tag, build]
    if: needs.check-release-tag.outputs.version != ''
    environment:
      name: pypi
      url: https://pypi.org/p/uiautomator2-mcp-server

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-release-tag, build, build-executable]
    if: needs.check-release-tag.outputs.version != ''
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download all executable artifacts
        uses: actions/download-artifact@v8
        with:
          path: executables/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: v${{ needs.check-release-tag.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            executables/*
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
