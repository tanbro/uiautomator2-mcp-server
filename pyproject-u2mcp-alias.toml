# u2mcp - Alias package for uiautomator2-mcp-server
#
# This package is a thin alias that forwards to the main package.
# When you install 'u2mcp', it installs 'uiautomator2-mcp-server' as a dependency.
# The 'u2mcp' command is then available as a convenient CLI entry point.
#
# In v1.0.0, 'u2mcp' will become the primary package name.
#
# To publish this alias package:
# 1. Create a temp directory
# 2. Copy this file there as pyproject.toml
# 3. Copy README-ALIAS.md there as README.md
# 4. Copy u2mcp/__init__.py there (create this file, see below)
# 5. uv build --out-dir dist/
# 6. uv publish dist/u2mcp-*.whl dist/u2mcp-*.tar.gz
#
# u2mcp/__init__.py content:
#     # This is an alias package - see uiautomator2-mcp-server
#     from u2mcp import __version__
#
#     __all__ = ["__version__"]

[project]
name = "u2mcp"
version = "0.3.0"  # Track with main package version
description = "MCP server for Android device automation using uiautomator2"
readme = "README.md"
authors = [{ name = "tanbro", email = "tanbro@163.com" }]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Depend on the real package
dependencies = [
  "uiautomator2-mcp-server>=0.3.0",
]

keywords = [
  "uiautomator2",
  "mcp",
  "mcp-server",
  "fastmcp",
  "adb",
  "android",
  "adbutils",
  "automation",
  "testing",
  "bot",
  "ai",
  "artificial-intelligence",
  "rpa",
  "test",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
homepage = "https://github.com/tanbro/uiautomator2-mcp-server"
documentation = "https://github.com/tanbro/uiautomator2-mcp-server/blob/main/README.md"
repository = "https://github.com/tanbro/uiautomator2-mcp-server.git"
issues = "https://github.com/tanbro/uiautomator2-mcp-server/issues"
changelog = "https://github.com/tanbro/uiautomator2-mcp-server/blob/main/CHANGELOG.md"

# CLI entry point - forwards to uiamcp package's main
[project.scripts]
u2mcp = "u2mcp.__main__:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
